[scenarios]
collect="请使用 report-analysis Skill，从数据门户筛选 2026 年 10 月、华东地区的数据：真实操作浏览器、翻页并下载 CSV，传到分析 Sandbox。用你生成的 Python 按分类、地区和日期统计金额，发布交互看板并导出 CSV、Excel、JSON 和离线报告。报告实际行数、总金额和两个 Sandbox ID。"
revise="沿用已下载的数据，找出金额最高的分类并排除，重新计算分类、地区和日期汇总，发布新看板并更新导出文件。不要重新下载，不修改 input.csv。说明排除了哪个分类、剩余行数和总金额。"
append="恢复展示所有分类。在当前 input.csv 追加一条记录：日期 2026-10-29，分类“现场演示”，地区“华东”，金额 6666。仅追加一次。重新生成并执行分析代码，发布看板并更新所有导出文件。报告与最初完整分析相比，行数与总金额的变化。"
